itle{font-weight:950;font-size:16px}.tablewrap{overflow:auto;max-height:67vh}table{width:100%;border-collapse:collapse;min-width:1180px}th{position:sticky;top:0;background:#102f4b;color:#9ed4f7;font-size:11px;text-align:left;padding:9px;border-bottom:1px solid #31506d;z-index:3}td{padding:8px 9px;border-bottom:1px solid #193a55;white-space:nowrap}tr:hover td{background:#102943}.status{font-weight:900;padding:3px 8px;border-radius:9px;display:inline-block}.정상{color:#40eca0;background:#0b3829}.수리중{color:#ffb43a;background:#4a3009}.입고대기{color:#ff7887;background:#46141c}.출고완료,.출고{color:#8bc7ff;background:#112e49}.meter{color:#48d5ff;font-weight:850}.danger{color:#ff6a78;font-weight:900}.warn{color:#ffc247;font-weight:900}.muted{color:#7e9bb2}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;align-items:center;justify-content:center}.modal.show{display:flex}.card{width:min(760px,94vw);background:#0d2237;border:1px solid #31506d;border-radius:14px;overflow:hidden}.cardhead{padding:13px 16px;background:#102b45;display:flex;align-items:center;font-weight:950;font-size:16px}.cardbody{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{font-size:11px;color:#9ab9d1;font-weight:800}.grid input,.grid select,.grid textarea{width:100%;margin-top:4px;background:#0b1c2e;color:#fff;border:1px solid #31506d;border-radius:8px;padding:9px}.grid textarea{min-height:80px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.availabilityGrid{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:8px;margin:10px 0 12px}.availCard{background:#0b1c2e;border:1px solid #214666;border-radius:10px;padding:10px 11px}.availTitle{font-weight:950;color:#eaf3ff;margin-bottom:6px}.availRate{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}.availRate strong{font-size:22px;color:#32e891}.availRate span{font-size:11px;color:#8eacc6}.availDetail{font-size:10px;color:#8eacc6;line-height:1.6}.availDet function render(){refreshKpi();if(tab==='maint'){renderMaint();return}if(tab==='inspect'){renderInspect();return}let arr=filteredMaster();const selected=$('#cat').value;$('#panelTitle').textContent=selected||'전체 현황';$('#thead').innerHTML='<tr><th>장비명</th><th>장비번호</th><th>카테고리</th><th>현재상태</th><th>가동</th><th>현재 HR/KM</th><th>점검주기</th><th>차기점검</th><th>잔여</th><th>현재 정비내용</th><th>비고</th></tr>';$('#tbody').innerHTML=arr.map(x=>`<tr><td><b>${esc(x.equipment_name)}</b></td><td>${esc(x.equipment_no)}</td><td>${esc(gseGroup(x))}</td><td><span class="status ${currentStatus(x)}">${currentStatus(x)}</span></td><td class="${isAvailableStatus(currentStatus(x))?'ok':'danger'}">${isAvailableStatus(currentStatus(x))?'가용':'비가용'}</td><td class="meter">${x.meter??'-'}</td><td>${esc(x.inspection_cycle||'-')}</td><td>${esc(x.next_inspection||'-')}</td><td>${esc(x.remaining||'-')}</td><td>${esc(currentIssue(x)||'-')}</td><td>${esc(x.note||'-')}</td></tr>`).join('');$('#rowCount').textContent=arr.length+'대'}
function renderMaint(){let q=$('#search').value.trim().toLowerCase();let arr=[...maint].filter(x=>!q||[x.equipment_no,x.equipment_name,x.issue,x.requester].join(' ').toLowerCase().includes(q)).sort((a,b)=>String(b.inbound_date||'9999').localeCompare(String(a.inbound_date||'9999')));$('#panelTitle').textContent='정비 입출고';$('#thead').innerHTML='<tr><th>입고일</th><th>장비명</th><th>장비번호</th><th>파손/정비 내용</th><th>정비의뢰자</th><th>출고일</th><th>상태</th><th>수리 소요</th><th>비고</th></tr>';$('#tbody').innerHTML=arr.map(x=>`<tr><td>${esc(x.inbound_date||'-')}</td><td><b>${esc(x.equipment_name)}</b></td><td>${esc(x.equipment_no)}</td><td>${esc(x.issue)}</td><td>${esc(x.requester||'-')}</td><td>${esc(x.outbound_date||'-')}</td><td><span class="status ${esc(x.status)}">${esc(x.status)}</span></td><td>${x.status==='입고대기'?'-':daysBetween(x.inbound_date,x.outbound_date)+(x.outbound_date?'일':'일째')}</td><td>${esc(x.note||'-')}</td></tr>`).join('');$('#rowCount').textContent=arr.length+'건'}
function renderInspect(){let arr=filteredMaster().filter(x=>x.inspection_type||x.inspection_cycle||x.meter!==null);$('#panelTitle').textContent='HOUR / 주기점검';$('#thead').innerHTML='<tr><th>장비명</th><th>장비번호</th><th>카테고리</th><th>현재 HR/KM</th><th>점검방식</th><th>주기</th><th>점검 완료</th><th>차기점검</th><th>잔여</th><th>연간점검</th><th>비고</th></tr>';$('#tbody').innerHTML=arr.map(x=>`<tr><td><b>${esc(x.equipment_name)}</b></td><td>${esc(x.equipment_no)}</td><td>${esc(gseGroup(x))}</td><td class="meter">${x.meter??'-'}</td><td>${esc(x.inspection_type||'-')}</td><td>${esc(x.inspection_cycle||'-')}</td><td>${esc(x.last_inspection||'-')}</td><td>${esc(x.next_inspection||'-')}</td><td>${esc(x.remaining||'-')}</td><td>${esc(x.annual||'-')}</td><td>${esc(x.note||'-')}</td></tr>`).join('');$('#rowCount').textContent=arr.length+'대'}
async function auth(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='index.html';return}$('#userBadge').textContent=session.user.email||'LOGIN'}
async function cloudLoad(){try{const [{data:m,error:e1},{data:r,error:e2}]=await Promise.all([sb.from('jas_gse_master').select('*').order('equipment_no'),sb.from('jas_gse_maintenance').select('*').order('id')]);if(e1)throw e1;if(e2)throw e2;if(m?.length)master=m.map(x=>({...x,meter:x.current_meter}));if(r?.length)maint=r;$('#cloudNote').textContent=`CLOUD ${master.length}대 · 정비 ${maint.length}건`;render()}catch(e){$('#cloudNote').textContent='CLOUD 미설정 · 초기 엑셀 데이터 사용';console.warn(e)}}
async function seedCloud(){if(!confirm(`초기 엑셀 장비 ${SEED_MASTER.length}대와 정비이력 ${SEED_MAINT.length}건을 CLOUD에 등록할까요?`))return;try{const m=SEED_MASTER.map(x=>({equipment_no:x.equipment_no,equipment_name:x.equipment_name,category:x.category,note:x.note||null,current_meter:x.meter,inspection_type:x.inspection_type||null,inspection_cycle:x.inspection_cycle||null,last_inspection:x.last_inspection||null,next_inspection:x.next_inspection||null,remaining:x.remaining||null,annual:x.annual||null,updated_at:new Date().toISOString()}));let {error}=await sb.from('jas_gse_master').upsert(m,{onConflict:'equipment_no'});if(error)throw error;for(const x of SEED_MAINT){let row={inbound_date:x.inbound_date||null,equipment_name:x.equipment_name,equipment_no:x.equipment_no,issue:x.issue||null,requester:x.requester||null,outbound_date:x.outbound_date||null,note:x.note||null,status:x.status,updated_at:new Date().toISOString()};let q=sb.from('jas_gse_maintenance').select('id').eq('equipment_no',x.equipment_no).eq('issue',x.issue||'');if(x.inbound_date)q=q.eq('inbound_date',x.inbound_date);else q=q.is('inbound_date',null);const {data:dup}=await q.limit(1);if(!dup?.length){const {error:er}=await sb.from('jas_gse_maintenance').insert(row);if(er)throw er}}await cloudLoad();alert('초기 데이터 CLOUD 등록 완료')}catch(e){alert('먼저 GSE SQL 설정을 실행해야 합니다.\n'+e.message)}}
function openMaint(){const today=new Date();$('#mNo').value='';$('#mName').value='';$('#mIn').value=today.toISOString().slice(0,10);$('#mOut').value='';$('#mReq').value='';$('#mStatus').value='수리중';$('#mIssue').value='';$('#mNote').value='';$('#maintModal').classList.add('show')}
async function saveMaint(){const no=$('#mNo').value.trim(),name=$('#mName').value.trim();if(!no||!name){alert('장비번호와 장비명을 입력해 주세요.');return}const row={inbound_date:$('#mIn').value||null,equipment_name:name,equipment_no:no,issue:$('#mIssue').value.trim()||null,requester:$('#mReq').value.trim()||null,outbound_date:$('#mOut').value||null,note:$('#mNote').value.trim()||null,status:$('#mStatus').value,updated_at:new Date().toISOString()};try{const {error}=await sb.from('jas_gse_maintenance').insert(row);if(error)throw error;$('#maintModal').classList.remove('show');await cloudLoad()}catch(e){alert(e.message)}}
function fillName(){const x=master.find(v=>v.equipment_no===$('#mNo').value.trim());if(x)$('#mName').value=x.equipment_name}
$('.tabs').addEventListener('click',e=>{if(!e.target.dataset.tab)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');tab=e.target.dataset.tab;render()});$('#categoryTabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;document.querySelectorAll('.catQuick').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#cat').value=b.dataset.cat||'';render()});$('#cat').addEventListener('change',()=>{document.querySelectorAll('.catQuick').forEach(x=>x.classList.toggle('active',(x.dataset.cat||'')===$('#cat').value));});['search','cat','statusFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));$('#reloadBtn').onclick=cloudLoad;$('#seedBtn').onclick=seedCloud;$('#newMaintBtn').onclick=openMaint;$('#closeModal').onclick=()=>$('#maintModal').classList.remove('show');$('#saveMaint').onclick=saveMaint;$('#mNo').addEventListener('change',fillName);$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};
(async()=>{await auth();$('#equipmentNos').innerHTML=master.map(x=>`<option value="${esc(x.equipment_no)}">${esc(x.equipment_name)}</option>`).join('');render();await cloudLoad()})();
</script></body></html>
