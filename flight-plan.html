*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#071426,#08111f);color:var(--text);font-family:Inter,"Noto Sans KR","Malgun Gothic",sans-serif}header{height:68px;padding:0 22px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:#081526}.brand{font-weight:950;color:var(--cyan);font-size:21px;text-decoration:none}.subtitle{color:#b8c8d9;font-weight:800}.spacer{flex:1}.user{font-size:12px;color:#9db2c7;border:1px solid #29425c;padding:6px 9px;border-radius:8px}.logout,.back{border:1px solid #2c5774;background:#10263c;color:#fff;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer;text-decoration:none}main{max-width:1450px;margin:auto;padding:28px 22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:900;letter-spacing:1.5px}h1{margin:6px 0 10px}.muted{color:var(--muted);line-height:1.6}.auth-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#071426}.auth-overlay.hidden{display:none}.login-card{width:min(420px,94vw);background:#0d1d31;border:1px solid #294866;border-radius:18px;padding:28px}.login-card input{width:100%;margin:6px 0 12px;background:#08182a;border:1px solid #2a4965;color:#fff;border-radius:9px;padding:12px}.login-card button{width:100%;background:#0b7198;border:1px solid #1199c8;color:#fff;border-radius:8px;padding:12px;font-weight:900}.msg{font-size:12px;color:#ff9aa8;margin-top:10px}

/* ===== JAS LOGO + DARK/LIGHT THEME ===== */
:root{
  --theme-bg:#000000;
  --theme-panel:#0c0c0c;
  --theme-panel2:#121212;
  --theme-line:#343434;
  --theme-text:#f5f5f5;
  --theme-muted:#9da4ad;
}
html,body{background:#000!important;color:#f5f5f5!important}
header{background:#000!important;border-color:#343434!important}
.jasBrandLink{display:flex;align-items:center;text-decoration:none;flex:0 0 auto}
.jasBrandLogo{display:block;width:92px;max-height:42px;object-fit:contain}
.themeToggle{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 10px!important;border-radius:999px!important;
  border:1px solid #3a3a3a!important;background:#0d0d0d!important;color:#f5f5f5!important;
  font-size:11px!important;font-weight:900!important;white-space:nowrap;cursor:pointer
}
.themeToggle:hover{background:#171717!important}
body.light-theme{background:#f4f7fb!important;color:#10253d!important}
body.light-theme header{background:#fff!important;border-color:#d8e0e9!important}
body.light-theme main{background:#f4f7fb!important}
body.light-theme .panel,
body.light-theme .card,
body.light-theme .kpi,
body.light-theme .rule,
body.light-theme .attendancePanel,
body.light-theme .timelineWrap,
body.light-theme .crewbox,
body.light-theme .box,
body.light-theme .summary,
body.light-theme .stat,
body.light-theme .standpanel,
body.light-theme .tableCard{
  background:#fff!important;border-color:#d8e0e9!important;color:#10253d!important
}
body.light-theme .panel-head,
body.light-theme .attendanceHead,
body.light-theme th,
body.light-theme thead th,
body.light-theme .timelineHeader,
body.light-theme .timelineLabel{
  background:#eef3f8!important;color:#24415f!important;border-color:#d8e0e9!important
}
body.light-theme td,
body.light-theme tr,
body.light-theme table{border-color:#dfe6ee!important}
body.light-theme .muted,
body.light-theme .note,
body.light-theme .legend,
body.light-theme .subtitle,
body.light-theme .small,
body.light-theme .rcmdate,
body.light-theme .badge{color:#60758a!important}
body.light-theme button,
body.light-theme .btn,
body.light-theme select,
body.light-theme input,
body.light-theme textarea,
body.light-theme .dateinput,
body.light-theme .search,
body.light-theme .keyinput{
  background:#fff!important;color:#10253d!important;border-color:#bfcbd7!important
}
body.light-theme .primary{background:#0b7da8!important;color:#fff!important}
body.light-theme .success{background:#16754c!important;color:#fff!important}
body.light-theme .themeToggle{background:#fff!important;color:#10253d!important;border-color:#cbd5df!important}
body.light-theme .auth-overlay{background:#f4f7fb!important}
body.light-theme .login-card{background:#fff!important;color:#10253d!important;border-color:#cbd5df!important}
body.light-theme .login-card input{background:#fff!important;color:#10253d!important}
body.light-theme .track{background:#f0f4f8!important}
body.light-theme .timeAxis{background:#eef3f8!important}
body.light-theme .attRow{border-color:#dfe6ee!important}
body.light-theme .attRow.virtual{background:#fff8df!important}
body.light-theme .memberPopover{background:#fffdf2!important;color:#111!important}

<script>
(function(){
  const KEY='jas_global_theme_v1';
  function applyTheme(theme){
    const light=theme==='light';
    document.body.classList.toggle('light-theme',light);
    const btn=document.getElementById('themeToggle');
    const icon=document.getElementById('themeIcon');
    const label=document.getElementById('themeLabel');
    if(icon)icon.textContent=light?'☀':'☾';
    if(label)label.textContent=light?'주간 모드':'다크 모드';
    if(btn)btn.setAttribute('aria-pressed',light?'true':'false');
    try{localStorage.setItem(KEY,light?'light':'dark');}catch{}
  }
  let saved='dark';
  try{saved=localStorage.getItem(KEY)||'dark';}catch{}
  applyTheme(saved);
  document.getElementById('themeToggle')?.addEventListener('click',()=>{
    applyTheme(document.body.classList.contains('light-theme')?'dark':'light');
  });
})();
</script>
